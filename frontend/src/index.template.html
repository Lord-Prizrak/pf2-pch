<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PF2e — интерактивный лист персонажа</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<!-- PF2E-BUILD-THEME: тема-раскладка (tools/build.py --theme), переопределяется выбором в шапке -->
<!-- PF2E-BUILD-PALETTE: цветовая гамма (tools/build.py --palette) -->
<script>window.__PF2E_BUILD_THEME__ = '__PF2E_THEME__';</script>
<script>window.__PF2E_BUILD_PALETTE__ = '__PF2E_PALETTE__';</script>
<!-- PF2E-SHEET-DATA:START -->
<script id="pf2e-embedded-data" type="application/json">null</script>
<!-- PF2E-SHEET-DATA:END -->
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-__PF2E_THEME_BODY__ pal-__PF2E_PALETTE_BODY__">
<header id="topbar">
  <div class="brand">PF<b>2e</b> Лист персонажа</div>
  <div id="char-switcher">
    <select id="character-select" title="Переключение персонажей"></select>
    <button id="btn-new-char" class="btn small" title="Новый персонаж">＋</button>
    <button id="btn-del-char" class="btn small danger" title="Удалить текущего персонажа">🗑</button>
  </div>
  <div class="save-state" id="save-state">—</div>
  <div class="topbar-appearance">
    <span class="picker-label">Раскладка:</span>
    <select id="theme-select" title="Тема: расположение блоков (раскладка)"></select>
    <span class="picker-label">Гамма:</span>
    <select id="palette-select" title="Цветовая гамма оформления"></select>
    <label class="edit-mode-label" title="Разрешить перетаскивание блоков за заголовки и изменение ширины/колонок текста">
      <input type="checkbox" id="edit-mode-check"> Редактирование
    </label>
  </div>
  <nav id="tabs-nav"></nav>
</header>

<main id="main">
  <!-- ==================== ВКЛАДКА: ЛИСТ ==================== -->
  <section id="tab-sheet" class="tabpage">
    <div class="grid sheet-grid" id="sheet-grid">
      <!-- лента для раскладки "Тёмный VTT" (strip): в неё JS копирует панель ПЗ/щита -->
      <div class="combat-strip" aria-hidden="true"></div>
      <div class="sheet-area" data-col="left">
      </div>
      <div class="sheet-area" data-col="mid">
      </div>
      <div class="sheet-area" data-col="right">
        <!-- верхняя панель: ПЗ + щит (раскладка "official") -->
      </div>
    </div>
  </section>

  <!-- ==================== ВКЛАДКА: ИНВЕНТАРЬ ==================== -->
  <section id="tab-inventory" class="tabpage hidden">
    <div class="grid3 inv-grid">
    </div>
  </section>

  <!-- ==================== ВКЛАДКА: БИОГРАФИЯ ==================== -->
  <section id="tab-bio" class="tabpage hidden">
    <div class="bio-grid">
    </div>
  </section>

  <!-- ==================== ВКЛАДКА: СЕРВЕРЫ ==================== -->
  <section id="tab-servers" class="tabpage hidden">
    <div class="srv-layout">
      <div class="srv-left">
      </div>
      <div class="srv-right">
      </div>
    </div>
  </section>

  <!-- ==================== ВКЛАДКА: ИМПОРТ/ЭКСПОРТ ==================== -->
  <section id="tab-io" class="tabpage hidden">
    <div class="grid3">
    </div>
  </section>

  <!-- ==== Вкладка «Блоки» ==== -->
  <section id="tab-blockvis" class="tabpage hidden">

  </section>
</main>

<div id="toast-wrap"></div>
<div id="modal-back" class="hidden"><div id="modal"></div></div>

<script src="app.js"></script>
</body>
</html>
